[workspace]
resolver = "2"
members = ["crates/engine", "crates/course", "crates/server"]
default-members = ["crates/server"]

[workspace.dependencies]
mark-one-engine = { path = "crates/engine" }
mark-one-course = { path = "crates/course" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
