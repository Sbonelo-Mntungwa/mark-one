<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark One</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%225.5%22 fill=%22none%22 stroke=%22%235ad7ff%22 stroke-width=%222%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%222%22 fill=%22%23ffb84d%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/panels.css">
<link rel="stylesheet" href="styles/hud.css">
<link rel="stylesheet" href="styles/marks.css">
<link rel="stylesheet" href="styles/brief.css">
<link rel="stylesheet" href="styles/dock.css">
<link rel="stylesheet" href="styles/help.css">
<link rel="stylesheet" href="styles/log.css">
<link rel="stylesheet" href="styles/board.css">
<link rel="stylesheet" href="styles/reactor.css">
<link rel="stylesheet" href="styles/overlays.css">
<link rel="stylesheet" href="styles/lesson.css">
<link rel="stylesheet" href="styles/program.css">
<link rel="stylesheet" href="styles/dialog.css">
<link rel="stylesheet" href="styles/library.css">
<link rel="stylesheet" href="styles/wave.css">
<link rel="stylesheet" href="styles/tools.css">
<link rel="stylesheet" href="styles/print.css">
<link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
<svg id="board" xmlns="http://www.w3.org/2000/svg" aria-label="Circuit board"></svg>

<header id="hud" class="panel">
  <div class="brand">
    <div class="word" aria-label="Mark One">MARK<span class="sp"></span><svg id="reactor" viewBox="-60 -60 120 120" aria-hidden="true"></svg>NE</div>
    <span id="progress"></span>
  </div>
  <div class="mark"><span class="mk" id="mk"></span><span class="nm" id="mname"></span><span class="pr" id="mprod"></span></div>
</header>

<nav id="marks" class="panel" aria-label="Marks"></nav>
<button id="paneTab" class="panetab" type="button"></button>

<aside id="brief" class="panel">
  <div class="bscroll">
    <div class="ptitle">Mission</div>
    <div class="sec" id="mission"></div>
    <div id="progWrap" class="hidden"><div class="ptitle">Program</div><div class="sec" id="prog"></div></div>
    <div id="dbgWrap" class="hidden"><div class="ptitle">Debugger</div><div class="sec" id="dbg"></div></div>
    <div class="ptitle" id="specTitle">Spec</div>
    <div class="sec" id="spec"></div>
    <div id="result"></div>
  </div>
  <div class="bank"><div class="ptitle">Databank</div><div class="sec" id="databank"></div></div>
</aside>

<div id="dock" class="panel" aria-label="Fabricator"></div>
<div id="wave" class="panel hidden" aria-label="Waveform"></div>
<footer id="helpbar" class="panel" aria-label="Keyboard shortcuts"></footer>
<div id="log" aria-live="polite"></div>
<div id="flags"></div>
<div id="scan"></div>
<div id="boot" class="hidden"></div>
<div id="lesson" class="hidden"></div>
<div id="library" class="hidden"></div>
<div id="dialog" class="hidden"></div>
<div id="printSheet" aria-hidden="true"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
